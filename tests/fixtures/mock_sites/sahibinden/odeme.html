<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ödeme - sahibinden.com</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body id="page-payment">
<header class="header-wrapper">
  <div class="container header">
    <a class="logo" href="index.html" title="sahibinden.com anasayfa"><svg viewBox="0 0 182 40" role="img" aria-label="sahibinden.com"><rect width="182" height="40" rx="3" fill="#ffe800"/><text x="10" y="27" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1c2e3f">sahibinden.com</text></svg></a>
    <form class="search-form" action="arama.html" method="get" role="search">
      <input type="text" name="query_text" id="searchText" placeholder="Kelime, ilan no veya mağaza adı ile ara" autocomplete="off">
      <button type="submit">Ara</button>
    </form>
    <ul class="header-links">
      <li class="guest-only"><a href="giris.html">Giriş Yap</a></li>
      <li class="guest-only"><a href="giris.html#hesap-ac">Hesap Aç</a></li>
      <li class="user-only" hidden><a href="index.html#bana-ozel">Bana Özel</a></li>
      <li class="user-only" hidden><span class="user-name">Deniz Y.</span></li>
      <li class="user-only" hidden><a href="index.html?cikis=1">Çıkış</a></li>
      <li><a class="post-classified-button" href="ilan-ver.html">Ücretsiz* İlan Ver</a></li>
    </ul>
  </div>
</header>
<div class="container page-content">
  <h1 class="page-title">Ödeme Bilgileri</h1>
  <p class="page-desc">Doping ödemenizi kredi kartı veya banka kartı ile güvenle yapabilirsiniz.</p>
  <div class="box">
    <div class="payment-summary" id="paymentSummary"></div>
    <form id="paymentForm" class="payment-form" novalidate>
      <div class="field"><label for="cardHolder">Kart Üzerindeki İsim</label><input type="text" id="cardHolder" name="cardHolder" autocomplete="cc-name"><div class="field-error" hidden></div></div>
      <div class="field"><label for="cardNumber">Kart Numarası</label><input type="text" id="cardNumber" name="cardNumber" inputmode="numeric" autocomplete="cc-number" placeholder="0000 0000 0000 0000"><div class="field-error" hidden></div></div>
      <div class="row2">
        <div class="field"><label for="cardExpiry">Son Kullanma Tarihi</label><input type="text" id="cardExpiry" name="cardExpiry" placeholder="AA/YY" autocomplete="cc-exp"><div class="field-error" hidden></div></div>
        <div class="field"><label for="cardCvv">CVV</label><input type="text" id="cardCvv" name="cardCvv" inputmode="numeric" maxlength="4" autocomplete="cc-csc"><div class="field-error" hidden></div></div>
      </div>
      <button type="submit" class="btn btn-primary btn-large" id="btnPay">Ödemeyi Tamamla</button>
      <a href="ilan-ver-doping.html" style="margin-left:14px">Vazgeç</a>
    </form>
  </div>
</div>
<div class="footer" style="padding:10px 0"><div class="container">© 2000-2026 sahibinden.com · Test amaçlı taklit sayfa</div></div>
<script src="assets/common.js"></script>
<script src="assets/categories.js"></script>
<script src="assets/step-flow.js"></script>
</body>
</html>
